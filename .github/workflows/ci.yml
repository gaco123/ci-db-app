name: CI DB App

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Limpiar Todo
        run: docker compose down --rmi all

      - name: Ejecutar Docker Compose
        run: docker-compose up -d

      - name: Esperar servicios
        run: sleep 20

      - name: Verificar contenedores
        run: docker ps